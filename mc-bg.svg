<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6cb6ff"/>
      <stop offset="55%" stop-color="#9ed3ff"/>
      <stop offset="100%" stop-color="#e8f6ff"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a8fd4"/>
      <stop offset="100%" stop-color="#1e5f96"/>
    </linearGradient>
  </defs>

  <!-- 天空 -->
  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- 像素太阳（带光晕） -->
  <g>
    <rect x="1488" y="108" width="168" height="168" fill="#ffe066" opacity="0.35"/>
    <rect x="1512" y="132" width="120" height="120" fill="#ffd93b"/>
    <rect x="1520" y="140" width="104" height="104" fill="#ffed8a"/>
  </g>

  <!-- 方块云 -->
  <g fill="#ffffff">
    <g opacity="0.95">
      <rect x="180" y="220" width="150" height="60"/>
      <rect x="250" y="170" width="110" height="60"/>
      <rect x="120" y="260" width="100" height="50"/>
      <rect x="290" y="250" width="120" height="50"/>
    </g>
    <g opacity="0.85">
      <rect x="620" y="120" width="170" height="60"/>
      <rect x="700" y="80" width="120" height="50"/>
      <rect x="760" y="160" width="130" height="45"/>
    </g>
    <g opacity="0.9">
      <rect x="1100" y="300" width="140" height="55"/>
      <rect x="1160" y="255" width="110" height="55"/>
      <rect x="1240" y="330" width="120" height="45"/>
    </g>
  </g>

  <!-- 远处像素山（灰绿色块） -->
  <g>
    <path d="M0 700 L180 480 L360 700 Z" fill="#7c9d6e"/>
    <path d="M300 700 L520 430 L740 700 Z" fill="#6f9163"/>
    <path d="M620 700 L860 400 L1100 700 Z" fill="#7c9d6e"/>
    <path d="M1000 700 L1230 470 L1460 700 Z" fill="#6f9163"/>
    <path d="M1360 700 L1600 420 L1920 700 Z" fill="#7c9d6e"/>
    <!-- 山顶积雪 -->
    <rect x="500" y="430" width="20" height="20" fill="#f0f6f0"/>
    <rect x="840" y="400" width="20" height="20" fill="#f0f6f0"/>
    <rect x="860" y="420" width="20" height="20" fill="#f0f6f0"/>
    <rect x="1580" y="420" width="20" height="20" fill="#f0f6f0"/>
  </g>

  <!-- 水面（像素波纹） -->
  <rect x="0" y="700" width="1920" height="140" fill="url(#water)"/>
  <g fill="#6db8e8" opacity="0.7">
    <rect x="100" y="720" width="60" height="16"/>
    <rect x="300" y="760" width="80" height="16"/>
    <rect x="600" y="730" width="50" height="16"/>
    <rect x="900" y="770" width="70" height="16"/>
    <rect x="1200" y="740" width="60" height="16"/>
    <rect x="1500" y="780" width="80" height="16"/>
    <rect x="1700" y="720" width="50" height="16"/>
  </g>

  <!-- 草方块地面（底部两行） -->
  <g>
    <!-- 第一行草方块（绿顶） -->
    <rect x="0" y="840" width="1920" height="40" fill="#7cb342"/>
    <rect x="0" y="840" width="1920" height="40" fill="#8bc34a" opacity="0.4"/>
    <!-- 第二行泥土 -->
    <rect x="0" y="880" width="1920" height="40" fill="#8d6e63"/>
    <rect x="0" y="880" width="1920" height="40" fill="#795548" opacity="0.35"/>
    <!-- 第三行石头 -->
    <rect x="0" y="920" width="1920" height="160" fill="#9e9e9e"/>
    <rect x="0" y="920" width="1920" height="160" fill="#757575" opacity="0.3"/>
    <!-- 草方块分隔线 -->
    <g stroke="#689f38" stroke-width="2">
      <line x1="0" y1="880" x2="1920" y2="880"/>
      <line x1="0" y1="840" x2="1920" y2="840"/>
    </g>
  </g>

  <!-- 像素树 -->
  <g>
    <!-- 左树 -->
    <rect x="240" y="700" width="40" height="120" fill="#6d4c41"/>
    <rect x="200" y="640" width="120" height="70" fill="#2e7d32"/>
    <rect x="220" y="590" width="80" height="60" fill="#388e3c"/>
    <!-- 右树 -->
    <rect x="1560" y="700" width="40" height="120" fill="#6d4c41"/>
    <rect x="1520" y="640" width="120" height="70" fill="#2e7d32"/>
    <rect x="1540" y="590" width="80" height="60" fill="#388e3c"/>
  </g>

  <!-- 草地小花点缀 -->
  <g>
    <rect x="420" y="820" width="12" height="20" fill="#ef5350"/>
    <rect x="414" y="840" width="24" height="12" fill="#ef5350"/>
    <rect x="700" y="826" width="12" height="14" fill="#fff176"/>
    <rect x="694" y="840" width="24" height="12" fill="#fff176"/>
    <rect x="1150" y="818" width="12" height="22" fill="#ab47bc"/>
    <rect x="1144" y="840" width="24" height="12" fill="#ab47bc"/>
    <rect x="1350" y="824" width="12" height="16" fill="#ef5350"/>
    <rect x="1344" y="840" width="24" height="12" fill="#ef5350"/>
    <rect x="880" y="820" width="12" height="20" fill="#fff176"/>
    <rect x="874" y="840" width="24" height="12" fill="#fff176"/>
  </g>

  <!-- 苦力怕脸（右下角水印，像素风） -->
  <g transform="translate(1760, 780)">
    <rect x="0" y="0" width="100" height="100" fill="#5cb85c"/>
    <rect x="20" y="20" width="20" height="30" fill="#2d5a2d"/>
    <rect x="60" y="20" width="20" height="30" fill="#2d5a2d"/>
    <rect x="20" y="60" width="20" height="20" fill="#2d5a2d"/>
    <rect x="60" y="60" width="20" height="20" fill="#2d5a2d"/>
    <rect x="40" y="30" width="20" height="10" fill="#2d5a2d"/>
  </g>
</svg>
